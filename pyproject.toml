[project]
name = "rolling"
version = "0.1.0"
description = "A Python package for analysis of hormone data with menstruation cycle tracking."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Vuyo Kwakweni", email = "vuyo-dev@literaturelounge.org" }]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]

# the analysis engine needs scipy only
dependencies = [
    "scipy",
]

[project.optional-dependencies]
api = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "psycopg2-binary",
    "python-dotenv",
    "email-validator",
    "python-multipart",
    "pwdlib[argon2]",
]
ai = [
    "openai",
    "ollama",
    "requests",
]
dev = [
    "pytest",
    "build",
]

[project.urls]
Repository = "https://github.com/vkwakweni/rolling-api"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["rolling*"]

[tool.setuptools.package-data]
rolling = ["py.typed"]
